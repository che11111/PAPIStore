help: |
  &6&lСправка администратора PAPIStore
  &e/papistore help
  &7Показать эту справку.
  &e/papistore refresh <игрок>
  &7Обновить сохранённые данные игрока онлайн. Право: papistore.op
  &e/papistore create <переменная PAPI> <столбец> <отображаемое имя>
  &7Создать столбец и сохранить выражение PAPI. Значение должно предоставляться PAPI или установленным расширением.
  &e/papistore generate <столбец>
  &7Обновить выбранный столбец для всех игроков онлайн.
  &e/papistore generate all
  &7Обновить все столбцы для всех игроков онлайн.
  &e/papistore query <игрок/UUID>
  &7Показать данные с отображаемыми именами. Право: papistore.query или papistore.op
  &e/papistore me
  &7Показать ваши собственные сохранённые данные. Право: papistore.query.self
  &e/mydata
  &7Сокращение для /papistore me. Каждую команду можно отдельно включить в config.yml.
  &e/papistore migrate <источник> <цель>
  &7Копировать все данные между SQLite и MySQL. Цель очищается только после подтверждения.
  &e/papistore reload
  &7Перезагружает fields.yml, языковые файлы и настройки запросов игроков. Изменения базы данных и планировщика по-прежнему требуют перезапуска.
