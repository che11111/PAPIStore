help: |
  &6&lPAPIStore 管理员帮助
  &e/papistore help
  &7显示本帮助页面。
  &e/papistore refresh <玩家>
  &7刷新指定在线玩家的已存储数据。权限：papistore.op
  &e/papistore create <PAPI变量> <列名> <备注名>
  &7创建数据库列并保存 PAPI 表达式。变量必须由 PAPI 核心或已安装的扩展提供。
  &e/papistore generate <列名>
  &7为所有在线玩家刷新指定字段。
  &e/papistore generate all
  &7为所有在线玩家刷新全部字段。
  &e/papistore query <玩家名/UUID>
  &7使用备注名显示玩家已存储的数据。权限：papistore.query 或 papistore.op
  &e/papistore me
  &7查询自己的已存储数据。权限：papistore.query.self
  &e/mydata
  &7/papistore me 的快捷指令，可在 config.yml 中分别开启或关闭。
  &e/papistore migrate <源类型> <目标类型>
  &7在 SQLite 和 MySQL 之间迁移全部数据。只有确认后才会清空目标库数据。
  &e/papistore reload
  &7重载 fields.yml、语言文件和玩家查询开关。数据库连接与调度参数仍需重启。
