help: |
  &6&lPAPIStore Administrator Help
  &e/papistore help
  &7Show this help page.
  &e/papistore refresh <player>
  &7Refresh stored data for an online player. Permission: papistore.op
  &e/papistore create <PAPI variable> <column> <display name>
  &7Create a database column and save its PAPI expression. The value must come from PAPI or an installed expansion.
  &e/papistore generate <column>
  &7Refresh one configured column for all online players.
  &e/papistore generate all
  &7Refresh every configured column for all online players.
  &e/papistore query <player/uuid>
  &7Show stored data using display names. Permission: papistore.query or papistore.op
  &e/papistore me
  &7Show your own stored data. Permission: papistore.query.self
  &e/mydata
  &7Shortcut for /papistore me. Each player command can be enabled separately in config.yml.
  &e/papistore migrate <source> <target>
  &7Copy all stored data between SQLite and MySQL. The target is cleared only after confirmation.
  &e/papistore reload
  &7Reload fields.yml, language files, and player-query switches. Database and scheduler settings still require a restart.
