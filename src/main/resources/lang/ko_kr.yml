help: |
  &6&lPAPIStore 관리자 도움말
  &e/papistore help
  &7이 도움말을 표시합니다.
  &e/papistore refresh <플레이어>
  &7온라인 플레이어의 저장 데이터를 갱신합니다. 권한: papistore.op
  &e/papistore create <PAPI 변수> <컬럼> <표시 이름>
  &7컬럼을 생성하고 PAPI 표현식을 저장합니다. 값은 PAPI 또는 설치된 확장 기능에서 제공되어야 합니다.
  &e/papistore generate <컬럼>
  &7모든 온라인 플레이어의 지정 컬럼을 갱신합니다.
  &e/papistore generate all
  &7모든 온라인 플레이어의 모든 컬럼을 갱신합니다.
  &e/papistore query <플레이어/UUID>
  &7표시 이름으로 저장 데이터를 표시합니다. 권한: papistore.query 또는 papistore.op
  &e/papistore me
  &7자신의 저장 데이터를 표시합니다. 권한: papistore.query.self
  &e/mydata
  &7/papistore me의 단축 명령어이며 config.yml에서 각각 켜거나 끌 수 있습니다.
  &e/papistore migrate <원본> <대상>
  &7SQLite와 MySQL 사이에서 모든 데이터를 이전합니다. 확인 후에만 대상을 지웁니다.
  &e/papistore reload
  &7fields.yml, 언어 파일 및 플레이어 조회 설정을 다시 불러옵니다. 데이터베이스와 스케줄러 설정 변경은 재시작이 필요합니다.
