help: |
  &6&lAyuda de administrador de PAPIStore
  &e/papistore help
  &7Muestra esta página de ayuda.
  &e/papistore refresh <jugador>
  &7Actualiza los datos guardados de un jugador en línea. Permiso: papistore.op
  &e/papistore create <variable PAPI> <columna> <nombre visible>
  &7Crea una columna y guarda la expresión PAPI. El valor debe provenir de PAPI o de una expansión instalada.
  &e/papistore generate <columna>
  &7Actualiza una columna configurada para todos los jugadores en línea.
  &e/papistore generate all
  &7Actualiza todas las columnas para todos los jugadores en línea.
  &e/papistore query <jugador/UUID>
  &7Muestra los datos con nombres visibles. Permiso: papistore.query o papistore.op
  &e/papistore me
  &7Muestra tus propios datos guardados. Permiso: papistore.query.self
  &e/mydata
  &7Atajo de /papistore me. Cada comando puede activarse por separado en config.yml.
  &e/papistore migrate <origen> <destino>
  &7Copia todos los datos entre SQLite y MySQL. El destino solo se vacía tras confirmar.
  &e/papistore reload
  &7Recarga fields.yml, los archivos de idioma y las opciones de consulta. Los ajustes de base de datos y planificación aún requieren reiniciar.
