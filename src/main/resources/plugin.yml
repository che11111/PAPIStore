name: PAPIStore
version: '${project.version}'
main: dev.che1s.papistore.PapiStorePlugin
author: che1s
folia-supported: true
depend: [ PlaceholderAPI ]

commands:
  papistore:
    description: Main command.
  mydata:
    description: 查询自己的 PAPIStore 数据.

permissions:
  papistore.refresh:
    description: 刷新自己papi数据的权限.
    default: true
  papistore.op:
    description: 管理员权限.
    default: op
  papistore.query:
    description: 查询玩家已存储的 PAPI 数据.
    default: op
  papistore.query.self:
    description: 查询自己的已存储 PAPI 数据.
    default: true
