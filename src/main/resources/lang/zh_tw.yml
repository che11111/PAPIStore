help: |
  &6&lPAPIStore 管理員說明
  &e/papistore help
  &7顯示此說明頁面。
  &e/papistore refresh <玩家>
  &7重新整理指定線上玩家的已儲存資料。權限：papistore.op
  &e/papistore create <PAPI變數> <欄位> <備註名稱>
  &7建立資料庫欄位並儲存 PAPI 表達式。變數必須由 PAPI 核心或已安裝的擴充套件提供。
  &e/papistore generate <欄位>
  &7為所有線上玩家重新整理指定欄位。
  &e/papistore generate all
  &7為所有線上玩家重新整理全部欄位。
  &e/papistore query <玩家/UUID>
  &7使用備註名稱顯示玩家已儲存的資料。權限：papistore.query 或 papistore.op
  &e/papistore me
  &7查詢自己的已儲存資料。權限：papistore.query.self
  &e/mydata
  &7/papistore me 的快速指令，可在 config.yml 中分別開啟或關閉。
  &e/papistore migrate <來源類型> <目標類型>
  &7在 SQLite 和 MySQL 之間遷移全部資料。只有確認後才會清空目標資料。
  &e/papistore reload
  &7重新載入 fields.yml、語言檔案與玩家查詢開關。資料庫連線與排程參數仍需重新啟動。
