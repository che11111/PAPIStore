help: |
  &6&lAide administrateur PAPIStore
  &e/papistore help
  &7Affiche cette page d’aide.
  &e/papistore refresh <joueur>
  &7Actualise les données d’un joueur en ligne. Permission : papistore.op
  &e/papistore create <variable PAPI> <colonne> <nom affiché>
  &7Crée une colonne et enregistre l’expression PAPI. La valeur doit provenir de PAPI ou d’une extension installée.
  &e/papistore generate <colonne>
  &7Actualise une colonne configurée pour tous les joueurs en ligne.
  &e/papistore generate all
  &7Actualise toutes les colonnes pour tous les joueurs en ligne.
  &e/papistore query <joueur/UUID>
  &7Affiche les données avec les noms affichés. Permission : papistore.query ou papistore.op
  &e/papistore me
  &7Affiche tes propres données enregistrées. Permission : papistore.query.self
  &e/mydata
  &7Raccourci de /papistore me. Chaque commande peut être activée séparément dans config.yml.
  &e/papistore migrate <source> <destination>
  &7Copie toutes les données entre SQLite et MySQL. La destination n’est vidée qu’après confirmation.
  &e/papistore reload
  &7Recharge fields.yml, les fichiers de langue et les options de consultation. Les réglages de base de données et de planification nécessitent toujours un redémarrage.
