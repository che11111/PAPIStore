help: |
  &6&lPAPIStore Administrator-Hilfe
  &e/papistore help
  &7Zeigt diese Hilfe an.
  &e/papistore refresh <Spieler>
  &7Aktualisiert die gespeicherten Daten eines Online-Spielers. Berechtigung: papistore.op
  &e/papistore create <PAPI-Variable> <Spalte> <Anzeigename>
  &7Erstellt eine Spalte und speichert den PAPI-Ausdruck. Der Wert muss von PAPI oder einer installierten Erweiterung stammen.
  &e/papistore generate <Spalte>
  &7Aktualisiert eine konfigurierte Spalte für alle Online-Spieler.
  &e/papistore generate all
  &7Aktualisiert alle Spalten für alle Online-Spieler.
  &e/papistore query <Spieler/UUID>
  &7Zeigt gespeicherte Daten mit Anzeigenamen. Berechtigung: papistore.query oder papistore.op
  &e/papistore me
  &7Zeigt deine eigenen gespeicherten Daten. Berechtigung: papistore.query.self
  &e/mydata
  &7Kurzform von /papistore me. Beide Befehle lassen sich in config.yml getrennt aktivieren.
  &e/papistore migrate <Quelle> <Ziel>
  &7Kopiert alle Daten zwischen SQLite und MySQL. Das Ziel wird erst nach Bestätigung geleert.
  &e/papistore reload
  &7Lädt fields.yml, Sprachdateien und Spielerabfrage-Einstellungen neu. Datenbank- und Scheduler-Einstellungen benötigen weiterhin einen Neustart.
