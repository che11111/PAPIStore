help: |
  &6&lPAPIStore 管理者ヘルプ
  &e/papistore help
  &7このヘルプを表示します。
  &e/papistore refresh <プレイヤー>
  &7オンラインプレイヤーの保存データを更新します。権限: papistore.op
  &e/papistore create <PAPI変数> <カラム> <表示名>
  &7カラムを作成して PAPI 式を保存します。値は PAPI またはインストール済みの拡張機能から取得する必要があります。
  &e/papistore generate <カラム>
  &7すべてのオンラインプレイヤーの指定カラムを更新します。
  &e/papistore generate all
  &7すべてのオンラインプレイヤーの全カラムを更新します。
  &e/papistore query <プレイヤー/UUID>
  &7表示名を使用して保存データを表示します。権限: papistore.query または papistore.op
  &e/papistore me
  &7自分の保存データを表示します。権限: papistore.query.self
  &e/mydata
  &7/papistore me のショートカットです。config.yml で個別に有効化できます。
  &e/papistore migrate <移行元> <移行先>
  &7SQLite と MySQL の間で全データを移行します。確認後のみ移行先を消去します。
  &e/papistore reload
  &7fields.yml、言語ファイル、プレイヤー照会設定を再読み込みします。データベースとスケジューラ設定の変更には再起動が必要です。
